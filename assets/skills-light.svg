<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-label="Skills">
<style>
.lab{font:700 19px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#0F2236}
