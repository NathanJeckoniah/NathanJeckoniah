<svg xmlns="http://www.w3.org/2000/svg" width="300" height="186" viewBox="0 0 300 186" role="img" aria-label="Shipyard Collective">
<style>
.ti{font:700 20px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#0F2236}
.de{font:400 15px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#4B6584}
.do{font:600 13px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#4A86C5}
.bar{fill:#4A86C5}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){.bar{animation:none}}
</style>
<rect x=".5" y=".5" width="299" height="185" rx="14" fill="#FFFFFF" stroke="#DCE6F5"/>
<rect x="28" y="26" width="44" height="4" rx="2" class="bar"/>
<text x="28" y="62" class="ti">Shipyard Collective</text>
<text y="92" class="de"><tspan x="28" dy="0">A forum for DevOps and</tspan><tspan x="28" dy="22">infrastructure work.</tspan></text>
<text x="28" y="164" class="do">shipyardcollective.dev</text>
</svg>